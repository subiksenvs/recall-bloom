<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall Bloom · Study garden</title><link rel="stylesheet" href="/style.css"></head><body><header><small>LEARNING / SPACED PRACTICE</small><h1>Recall Bloom</h1><p>Grow durable knowledge, one retrieval at a time.</p><nav><span id="total">0 cards</span><span id="due">0 due</span><span id="learned">0 practiced</span></nav></header><main><section class="box"><h2>Study due cards</h2><div id="study">Loading your queue…</div></section><section class="box"><h2>Build a deck</h2><form id="add"><input name="deck" placeholder="Deck name" required><input name="front" placeholder="Question or prompt" required><textarea name="back" placeholder="Answer or explanation" required></textarea><button>Add flashcard</button></form><form id="generate"><h3>Draft cards with AI</h3><input name="topic" placeholder="Topic to study"><button>Generate draft cards</button><small>Review generated facts before relying on them.</small></form></section><section class="box wide"><h2>All cards</h2><div id="cards"></div></section></main><dialog id="answer"><p id="back"></p><div class="grades"><button data-grade="again">Again</button><button data-grade="hard">Hard</button><button data-grade="good">Good</button><button data-grade="easy">Easy</button></div></dialog><script src="/app.js"></script></body></html>
